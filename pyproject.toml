[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pinterest-dl"
version = "0.0.0.dev0"
description = "An unofficial Pinterest image downloader"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "sean1832", email = "dev@zekezhang.com" }]
requires-python = ">=3.10"
keywords = ["pinterest", "image downloader", "web scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Environment :: Console",
]
dependencies = [
    "flask>=3.0.0",
    "gunicorn>=23.0.0",
    "playwright>=1.40.0",
    "selenium>=4.26.1",
    "tqdm",
    "requests",
    "deprecated",
    "m3u8",
    "cryptography",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-mock>=3.10.0"]
image = ["pillow==10.4.0"]
exif = ["pyexiv2"]
metadata = ["pillow==10.4.0", "pyexiv2"]
all = ["pillow==10.4.0", "pyexiv2"]

[project.scripts]
pinterest-dl = "pinterest_dl.cli:main"
pin-dl = "pinterest_dl.cli:main"

[project.urls]
Homepage = "https://github.com/sean1832/pinterest-dl"
Issues = "https://github.com/sean1832/pinterest-dl/issues"

[tool.setuptools]
packages = { find = { include = ["pinterest_dl*"] } }
